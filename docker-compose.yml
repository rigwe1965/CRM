# Optional local Postgres: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:5432:5432" # localhost only: never publish the database to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the restricted crm_app role on first start (see .env.example and TECHNICIAN.md, "Local development").
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
volumes:
  pgdata:
