name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs to write to the repository, so the token may only read it.
permissions:
  contents: read
  pull-requests: read # gitleaks lists the pull request's commits

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev
      - name: Secrets committed to the repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
      DIRECT_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
      # The two-tenant isolation tests build and drop their own throwaway schema inside this database.
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
      NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrations apply cleanly to an empty database
        run: npm run db:deploy
      - name: Schema and migrations are in sync
        run: >-
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL" --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (none may be skipped; a skipped database test proved nothing)
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json
          node -e "const r=require('./vitest-report.json'); const n=r.numPendingTests+r.numTodoTests; if(n){console.error('Skipped or todo tests: '+n); process.exit(1)}"
      - run: npm run build
