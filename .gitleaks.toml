# Extend gitleaks' default rules; only the test files below are exempt.
[extend]
useDefault = true

[[allowlists]]
description = "Made-up Stripe keys and app secrets used as test values (never real credentials)"
paths = [
  '''tests/integrations\.test\.ts''',
  '''tests/tenant-integrations\.test\.ts''',
  '''tests/tenant-signup-billing\.test\.ts''',
]
